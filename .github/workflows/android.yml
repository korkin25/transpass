name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ${{ github.event_name != 'pull_request' && vars.ANDROID_RUNNER || 'ubuntu-24.04' }}
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.ci/gradle
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Put self-hosted tools on the runner work volume
        if: runner.environment == 'self-hosted'
        run: |
          echo "ANDROID_HOME=$GITHUB_WORKSPACE/.ci/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$GITHUB_WORKSPACE/.ci/android-sdk" >> "$GITHUB_ENV"
          echo "RUNNER_TOOL_CACHE=$GITHUB_WORKSPACE/.ci/tool-cache" >> "$GITHUB_ENV"
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        if: runner.environment == 'self-hosted'
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Test, lint and build APK
        run: |
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
          ./scripts/check-apk.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: transpass-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
